{% extends "base.html" %}
{% block title %}Compass — Sign in{% endblock %}

{% block content %}
<h1>Sign in</h1>
<p class="sub">Compass is invite-only. If you don't have an account, ask whoever runs this instance for a link.</p>

<form method="post" action="/login" class="card">
  <input type="hidden" name="next" value="{{ next or '/' }}">
  <div class="field">
    <label>Email</label>
    <input type="email" name="email" value="{{ email or '' }}" autocomplete="username" autofocus required>
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" name="password" autocomplete="current-password" required>
  </div>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
