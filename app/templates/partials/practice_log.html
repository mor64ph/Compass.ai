<div class="chat" id="practice-chat-inner">
  {% if not practice or not practice.transcript %}
    <div class="msg assistant">Say "start" when you're ready — I'll open with the first likely question from your brief.</div>
  {% else %}
    {% for turn in practice.transcript %}
      <div class="msg {{ turn.role }}">{{ turn.content }}</div>
    {% endfor %}
  {% endif %}
</div>
<script>
(function() {
  var el = document.getElementById('practice-chat-inner');
  if (el) { el.scrollTop = el.scrollHeight; }
})();
</script>
