[pytest]
# Keep pytest's scratch directory inside the project.
#
# The default is %LOCALAPPDATA%\Temp\pytest-of-<user>, and on a managed Windows
# machine that path can end up owned by something the user cannot touch — the
# endpoint-security agent locks it, and then every test using `tmp_path` errors
# with "WinError 5 Access is denied" before it runs. The ACL was unreadable and
# the directory unremovable even with -Force, so there is nothing to fix; the
# answer is to stop using that location.
#
# Project-local also means `git clean` disposes of it, which the default does not.
addopts = --basetemp=.pytest-tmp

testpaths = tests

# Quieter output. The embedding model's own loader is noisy on import and buries
# the actual failures.
filterwarnings =
    ignore::DeprecationWarning:pkg_resources.*
