# Render blueprint. Lives at the repository root because that is the only place
# Render looks for it.
#
#   Render dashboard -> New -> Blueprint -> pick this repo
#
# Free tier, no card. The two things to know before relying on it:
#
#   512 MB of RAM, which is why this uses deploy/render/requirements-slim.txt
#   and runs without the semantic embedding model. That file documents exactly
#   what the loss is.
#
#   No persistent disk, so the database is rebuilt on every deploy and every
#   wake from idle. COMPASS_DEMO_MODE re-seeds a populated demo each time, which
#   is what makes that survivable rather than merely broken.
#
# For a deployment that keeps data, see docs/DEPLOY.md.

services:
  - type: web
    name: compass
    runtime: docker
    plan: free
    region: singapore          # closest free region to India
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .           # the app/ tree is at the root
    healthCheckPath: /login    # the only page reachable without a session

    envVars:
      # Generated by Render and never shown to me. Compass refuses to start with
      # its shipped placeholder when bound publicly, so this must be a real
      # value - `generateValue` produces one per service.
      - key: COMPASS_SECRET_KEY
        generateValue: true

      # Set this in the dashboard after the first deploy: Environment -> Add
      # Environment Variable. Left unset, the deterministic half of Compass
      # still works - ATS checks, JD scoring, the quality gate, the tracker,
      # discovery - and only the LLM features report as unconfigured.
      - key: GEMINI_API_KEY
        sync: false

      - key: COMPASS_LLM_PROVIDER
        value: gemini
      - key: COMPASS_GEMINI_MODEL
        value: gemini-3.5-flash

      # A visitor to a public URL has no invite, so without this they see a
      # login wall and nothing else.
      - key: COMPASS_DEMO_MODE
        value: "true"

      # Render terminates TLS.
      - key: COMPASS_HTTPS_ONLY
        value: "true"
