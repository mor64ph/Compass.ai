# Render blueprint. Must live at the repository root - that is the only place
# Render looks.
#
#   Render dashboard -> New -> Blueprint -> pick this repo -> Apply
#
# Uses Render's **native Python runtime**, not Docker. Two reasons:
#
#   Render's own free-tier documentation lists native runtimes (Node, Python,
#   Rails) and does not state that Docker is included on Free. Rather than find
#   out after a build, this takes the path that is unambiguously available.
#   deploy/render/Dockerfile still exists if you want a container, here or
#   anywhere else.
#
#   It is also simply faster: no image to build, push or pull, so a deploy is a
#   pip install rather than ten minutes of layers.
#
# Two things to know before relying on this:
#
#   512 MB of RAM, which is why the build installs
#   deploy/render/requirements-slim.txt and runs without the semantic embedding
#   model. That file documents exactly what is lost - and the quality gate's
#   divergence signal is where it costs most.
#
#   No persistent disk on Free, so the database is rebuilt on every deploy and
#   every wake from idle. COMPASS_DEMO_MODE re-seeds a populated demo each time,
#   which is what makes that survivable rather than merely broken.
#
# For a deployment that keeps its data and runs the real model, see
# docs/DEPLOY.md.

services:
  - type: web
    name: compass
    runtime: python
    plan: free
    region: singapore          # closest Free region to India

    buildCommand: pip install --upgrade pip && pip install -r deploy/render/requirements-slim.txt
    # $PORT is assigned by Render at runtime and must be honoured; a hardcoded
    # port fails the health check. One worker on purpose - the login throttle and
    # the LLM rate limiter are per-process, so a second would silently double
    # both, and 0.1 CPU has room for one anyway.
    #
    # Note what is NOT here: `--forwarded-allow-ips '*'`. Whether that asterisk
    # survives depends on the shell running this line, and a glob expansion
    # turns it into a directory listing and a startup crash. It is set as the
    # FORWARDED_ALLOW_IPS environment variable below instead, where no shell
    # touches it.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers

    healthCheckPath: /login    # the only page reachable without a session

    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      # Read by uvicorn directly, which is why it is here and not a CLI flag:
      # an unquoted asterisk on a command line is a glob waiting to happen.
      #
      # Render's proxy is not on loopback, so without this uvicorn ignores
      # X-Forwarded-For and every request appears to come from the proxy - which
      # would make the login throttle's per-address key throttle all users at
      # once. app/security.py already treats that header as a convenience for
      # honest traffic rather than a security boundary, which is why the
      # per-email key exists beside it.
      - key: FORWARDED_ALLOW_IPS
        value: "*"

      # Generated per service by Render and never displayed. Compass refuses to
      # start with its shipped placeholder when bound publicly, because that
      # value is in a public repository and would leave every session cookie
      # forgeable.
      - key: COMPASS_SECRET_KEY
        generateValue: true

      # Add this yourself after the first deploy: Environment -> Add Environment
      # Variable. `sync: false` stops Render inventing a value. Left unset, the
      # deterministic half still works - ATS checks, JD scoring, the quality
      # gate, the tracker, discovery - and only the LLM features report as
      # unconfigured.
      - key: GEMINI_API_KEY
        sync: false

      - key: COMPASS_LLM_PROVIDER
        value: gemini
      - key: COMPASS_GEMINI_MODEL
        value: gemini-3.5-flash

      # A visitor to a public URL holds no invite, so without this they meet the
      # login wall and see nothing at all.
      - key: COMPASS_DEMO_MODE
        value: "true"

      # Render terminates TLS, so the session cookie must be marked Secure.
      - key: COMPASS_HTTPS_ONLY
        value: "true"

      # There is no model to warm on this plan; leaving it true would spend a
      # background thread on every boot discovering that.
      - key: COMPASS_PRELOAD_EMBEDDINGS
        value: "false"

      # SQLite in the service's ephemeral working directory.
      - key: COMPASS_DB_URL
        value: sqlite:///./compass.db
